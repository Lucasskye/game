<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D FPS Demo</title>
<style>
body{margin:0;overflow:hidden;background:#000}
#info{position:fixed;top:10px;left:10px;color:white;font-family:Arial;z-index:10}
</style>
</head>
<body>
<div id="info">3D FPS Demo | WASD = Gerak | Mouse/Touch = Lihat</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,1.6,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,1));

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshLambertMaterial({color:0x666666})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

for(let i=0;i<20;i++){
 const box=new THREE.Mesh(
   new THREE.BoxGeometry(2,2,2),
   new THREE.MeshLambertMaterial({color:0x888888})
 );
 box.position.set((Math.random()-0.5)*40,1,(Math.random()-0.5)*40);
 scene.add(box);
}

for(let i=0;i<10;i++){
 const enemy=new THREE.Mesh(
   new THREE.BoxGeometry(1,2,1),
   new THREE.MeshLambertMaterial({color:0xff0000})
 );
 enemy.position.set((Math.random()-0.5)*30,1,(Math.random()-0.5)*30);
 enemy.userData.enemy=true;
 scene.add(enemy);
}

const keys={};
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0,pitch=0;

document.body.addEventListener('click',()=>{
 document.body.requestPointerLock?.();
});

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement){
   yaw-=e.movementX*0.002;
   pitch-=e.movementY*0.002;
   pitch=Math.max(-1.5,Math.min(1.5,pitch));
 }
});

const raycaster=new THREE.Raycaster();
document.addEventListener('mousedown',()=>{
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(scene.children);
 for(const h of hits){
   if(h.object.userData.enemy){
     scene.remove(h.object);
     break;
   }
 }
});

function animate(){
 requestAnimationFrame(animate);

 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 const speed=0.12;

 if(keys.w){
   camera.position.x-=Math.sin(yaw)*speed;
   camera.position.z-=Math.cos(yaw)*speed;
 }
 if(keys.s){
   camera.position.x+=Math.sin(yaw)*speed;
   camera.position.z+=Math.cos(yaw)*speed;
 }
 if(keys.a){
   camera.position.x-=Math.cos(yaw)*speed;
   camera.position.z+=Math.sin(yaw)*speed;
 }
 if(keys.d){
   camera.position.x+=Math.cos(yaw)*speed;
   camera.position.z-=Math.sin(yaw)*speed;
 }

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
