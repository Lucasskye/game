<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile FPS 3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    touch-action:none;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:30px;
    z-index:20;
    pointer-events:none;
}

#fire{
    position:fixed;
    right:20px;
    bottom:80px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:rgba(255,0,0,.35);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    z-index:20;
}

#scope{
    position:fixed;
    right:130px;
    bottom:100px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(0,100,255,.35);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:20px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    z-index:20;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    left:40px;
    top:40px;
    border-radius:50%;
    background:white;
}
</style>
</head>

<body>

<div id="crosshair">+</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="scope">SCOPE</div>
<div id="fire">FIRE</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.7,5);

const renderer =
new THREE.WebGLRenderer({antialias:true});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);

const ambient =
new THREE.AmbientLight(0xffffff,2);

scene.add(ambient);

const floor =
new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({
color:0x666666
})
);

floor.rotation.x=-Math.PI/2;
scene.add(floor);

function wall(x,z){

const box =
new THREE.Mesh(
new THREE.BoxGeometry(2,2,2),
new THREE.MeshStandardMaterial({
color:0x888888
})
);

box.position.set(x,1,z);
scene.add(box);
}

wall(5,0);
wall(-5,0);
wall(0,5);

function createDummy(x,z){

const dummy = new THREE.Group();

const body =
new THREE.Mesh(
new THREE.BoxGeometry(1,1.5,0.6),
new THREE.MeshStandardMaterial({
color:0xff0000
})
);

body.position.y=1.5;

const head =
new THREE.Mesh(
new THREE.SphereGeometry(0.35),
new THREE.MeshStandardMaterial({
color:0xffffaa
})
);

head.position.y=2.6;

dummy.add(body);
dummy.add(head);

dummy.position.set(x,0,z);

dummy.userData.enemy=true;

scene.add(dummy);
}

createDummy(0,-10);
createDummy(5,-15);
createDummy(-5,-12);

const gun =
new THREE.Mesh(
new THREE.BoxGeometry(0.3,0.2,1),
new THREE.MeshStandardMaterial({
color:0x222222
})
);

gun.position.set(
0.5,
-0.4,
-1
);

camera.add(gun);
scene.add(camera);

let yaw=0;
let pitch=0;
let recoil=0;
let scoped=false;

let moveX=0;
let moveY=0;

const raycaster =
new THREE.Raycaster();

function shoot(){

recoil=0.08;

raycaster.setFromCamera(
new THREE.Vector2(0,0),
camera
);

const hits =
raycaster.intersectObjects(
scene.children,
true
);

for(const hit of hits){

let obj=hit.object;

while(obj){

if(obj.userData.enemy){

scene.remove(obj);
return;
}

obj=obj.parent;
}
}
}

document
.getElementById("fire")
.addEventListener(
"touchstart",
shoot
);

document
.getElementById("scope")
.addEventListener(
"touchstart",
()=>{

scoped=!scoped;

camera.fov=
scoped ? 30 : 75;

camera.updateProjectionMatrix();

}
);

let lookTouch=null;

document.addEventListener(
"touchstart",
e=>{

if(e.touches.length>0){

lookTouch=e.touches[0];

}

}
);

document.addEventListener(
"touchmove",
e=>{

if(e.touches.length>0){

const t=e.touches[0];

yaw -=
(t.clientX-lookTouch.clientX)
*0.005;

pitch -=
(t.clientY-lookTouch.clientY)
*0.005;

pitch=Math.max(
-1.3,
Math.min(1.3,pitch)
);

lookTouch=t;

}
}
);

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let joyActive=false;

joystick.addEventListener(
"touchstart",
()=>joyActive=true
);

joystick.addEventListener(
"touchend",
()=>{

joyActive=false;

moveX=0;
moveY=0;

stick.style.left="40px";
stick.style.top="40px";

}
);

joystick.addEventListener(
"touchmove",
e=>{

const rect=
joystick.getBoundingClientRect();

const x=
e.touches[0].clientX
-rect.left
-65;

const y=
e.touches[0].clientY
-rect.top
-65;

moveX=x/50;
moveY=y/50;

stick.style.left=
(40+x)+"px";

stick.style.top=
(40+y)+"px";

}
);

function animate(){

requestAnimationFrame(animate);

camera.rotation.order="YXZ";

camera.rotation.y=yaw;
camera.rotation.x=pitch-recoil;

recoil*=0.85;

camera.position.x +=
Math.sin(yaw)*(-moveY)*0.08;

camera.position.z +=
Math.cos(yaw)*(-moveY)*0.08;

camera.position.x +=
Math.sin(yaw+Math.PI/2)
*(-moveX)*0.05;

camera.position.z +=
Math.cos(yaw+Math.PI/2)
*(-moveX)*0.05;

gun.rotation.x=recoil*8;

renderer.render(
scene,
camera
);
}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>
</body>
</html>
